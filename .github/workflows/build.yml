name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: AnchorCore (Linux)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path Packages/AnchorCore

  app:
    name: Anchor.app (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 — образ на macOS 27.
        runner: [macos-26, xcode-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Свежий Xcode
        run: |
          XCODE=$( (ls -d /Applications/Xcode_*.app | grep -iv beta || ls -d /Applications/Xcode_*.app) | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers

      - name: Тесты ядра
        run: swift test --package-path Packages/AnchorCore

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка
        run: |
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=(ANCHOR_VERSION="$V" MARKETING_VERSION="${V%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER")
          fi
          xcodebuild -project Anchor.xcodeproj -scheme Anchor -configuration Release \
            -derivedDataPath build -quiet build "${VERSION_ARGS[@]}"
          /usr/libexec/PlistBuddy -c "Print :AnchorVersion" build/Build/Products/Release/Anchor.app/Contents/Info.plist
          codesign --force --deep --sign - build/Build/Products/Release/Anchor.app
          ditto -c -k --keepParent build/Build/Products/Release/Anchor.app Anchor.zip

      - name: DMG
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/Anchor.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Anchor -srcfolder dmg -ov -format UDZO Anchor.dmg

      - name: Запуск без демо не падает
        run: |
          mkdir -p shots
          open build/Build/Products/Release/Anchor.app
          sleep 8
          if ! pgrep -x Anchor; then
            echo "::error::Anchor упал при запуске"
            for f in ~/Library/Logs/DiagnosticReports/Anchor-*.ips; do
              tail -n +2 "$f" | jq -r '.exception, (.faultingThread as $t | .usedImages as $img | .threads[$t].frames[:25][] | "\($img[.imageIndex].name // "?")  \(.symbol // "")")'
            done
            exit 1
          fi
          screencapture -x shots/empty.png
          pkill -x Anchor

      - name: Скриншоты
        continue-on-error: true
        run: |
          APP=build/Build/Products/Release/Anchor.app
          brew install cliclick
          cliclick m:900,600
          open "$APP" --args --demo
          sleep 6
          screencapture -x shots/pill.png
          # Наведение: курсор на таблетку — карточка должна раскрыться.
          cliclick m:512,62
          sleep 2
          screencapture -x shots/hover.png
          cliclick m:900,600
          sleep 2
          screencapture -x shots/hover-out.png
          pkill -x Anchor || true
          sleep 1
          open "$APP" --args --demo --expanded
          sleep 6
          screencapture -x shots/expanded.png
          pkill -x Anchor || true
          sleep 1
          # Жесты: свайп шага вправо (середина и результат), переключение задачи скроллом по таблетке.
          # У синтетических событий нет флага «естественной прокрутки», поэтому пальцы вправо — это dx < 0, вверх — dy > 0.
          swiftc -O scripts/ci/scroll.swift -o /tmp/scroll
          open "$APP" --args --demo --expanded
          sleep 6
          /tmp/scroll 450 139 -100 0 hold
          sleep 0.5
          screencapture -x shots/swipe-hold.png
          /tmp/scroll 450 139 0 0 end
          sleep 1
          screencapture -x shots/swipe-done.png
          /tmp/scroll 512 62 0 80
          sleep 1
          screencapture -x shots/switch.png
          pkill -x Anchor || true
          sleep 1
          open "$APP" --args --demo --settings
          sleep 6
          screencapture -x shots/settings.png
          pkill -x Anchor || true
          sleep 1

          # Быстрый ввод: окно с примером, затем настоящий хоткей ⌃⌥Space и ввод с клавиатуры.
          open "$APP" --args --demo --capture
          sleep 6
          screencapture -x shots/capture.png
          cliclick kp:esc
          sleep 1
          cliclick kd:ctrl,alt kp:space ku:ctrl,alt
          sleep 1
          cliclick t:"Buy milk #home !"
          sleep 1
          screencapture -x shots/capture-hotkey.png
          cliclick kp:return
          sleep 1
          # Второй раз — чтобы поймать нестабильность Enter.
          cliclick kd:ctrl,alt kp:space ku:ctrl,alt
          sleep 1
          cliclick t:"Call dentist"
          cliclick kp:return
          sleep 1
          cliclick m:512,62
          sleep 2
          screencapture -x shots/capture-added.png
          cliclick m:900,600
          pkill -x Anchor || true
          sleep 1

          # Оформление: цветной фон и вкладка «Вид».
          defaults write xyz.gelsemium.anchor appearance.style -string solid
          defaults write xyz.gelsemium.anchor appearance.color -string "#2E7D5B"
          open "$APP" --args --demo --expanded
          sleep 6
          screencapture -x shots/appearance.png
          pkill -x Anchor || true
          sleep 1
          # Настройки без панели поверх: прячем её хоткеем ⌃⌥H.
          open "$APP" --args --demo --settings --settings-tab=appearance
          sleep 6
          cliclick kd:ctrl,alt t:h ku:ctrl,alt
          sleep 1
          screencapture -x shots/settings-appearance.png
          pkill -x Anchor || true
          defaults delete xyz.gelsemium.anchor || true
          sleep 1

          # Цветное стекло должно быть видно и без наведения.
          defaults write xyz.gelsemium.anchor appearance.style -string tintedGlass
          defaults write xyz.gelsemium.anchor appearance.color -string "#E86A5B"
          open "$APP" --args --demo
          sleep 6
          screencapture -x shots/tinted.png
          pkill -x Anchor || true
          defaults delete xyz.gelsemium.anchor || true

      - name: Синхронизация с Obsidian
        run: |
          APP=build/Build/Products/Release/Anchor.app
          TASKS="/tmp/vault/Anchor/Задачи.md"
          brew list cliclick >/dev/null 2>&1 || brew install cliclick
          mkdir -p /tmp/vault/.obsidian shots
          defaults write xyz.gelsemium.anchor obsidian.vaultPath -string /tmp/vault
          defaults write xyz.gelsemium.anchor obsidian.syncEnabled -bool true
          diagnose() {
            echo "::group::Диагностика"
            pgrep -lx Anchor || echo "Anchor не запущен"
            screencapture -x shots/vault-fail.png || true
            cat ~/Library/Application\ Support/Anchor/state.json || true
            defaults read xyz.gelsemium.anchor || true
            ls -laR /tmp/vault || true
            [ -f "$TASKS" ] && cat "$TASKS"
            for f in ~/Library/Logs/DiagnosticReports/Anchor-*.ips; do
              [ -f "$f" ] && tail -n +2 "$f" | jq -r '.exception, (.faultingThread as $t | .usedImages as $img | .threads[$t].frames[:25][] | "\($img[.imageIndex].name // "?")  \(.symbol // "")")'
            done
            echo "::endgroup::"
          }
          trap diagnose ERR
          open "$APP"
          sleep 6
          test -f "$TASKS"

          # Задача из приложения попадает в файл.
          cliclick kd:ctrl,alt kp:space ku:ctrl,alt
          sleep 1
          cliclick t:"Buy milk"
          cliclick kp:return
          sleep 2
          grep -q "Buy milk" "$TASKS"

          # Правка «из Obsidian» подхватывается и не стирается следующей записью приложения.
          printf -- '- [ ] From Obsidian 🆔 ext1\n' >> "$TASKS"
          sleep 4
          cliclick kd:ctrl,alt kp:space ku:ctrl,alt
          sleep 1
          cliclick t:"Second task"
          cliclick kp:return
          sleep 2
          cliclick m:512,62
          sleep 2
          screencapture -x shots/vault.png
          echo "--- $TASKS"; cat "$TASKS"
          grep -q "From Obsidian" "$TASKS"
          grep -q "Second task" "$TASKS"
          pkill -x Anchor || true
          defaults delete xyz.gelsemium.anchor || true

      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-26'
        with:
          name: Anchor-app
          path: |
            Anchor.zip
            Anchor.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: shots/
          if-no-files-found: ignore

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') && matrix.runner == 'macos-26'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv Anchor.dmg "Anchor-$VERSION.dmg"
          mv Anchor.zip "Anchor-$VERSION.zip"
          # Теги с дефисом (v0.1.0-beta.1) — пре-релизы.
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" "Anchor-$VERSION.dmg" "Anchor-$VERSION.zip" \
            --title "Anchor $VERSION" $PRERELEASE --notes-file .github/release-notes.md --generate-notes
